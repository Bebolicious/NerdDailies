<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAILIES — pixel puzzles for game nerds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=JetBrains+Mono:wght@400;500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Apply theme + readability before React mounts to avoid a flash.
      (function () {
        try {
          // An explicit choice (the settings toggle) wins and persists.
          // Otherwise follow the OS preference.
          var stored = localStorage.getItem('dailies/theme');
          var theme;
          if (stored === 'dark' || stored === 'light') {
            theme = stored;
          } else {
            theme =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        try {
          // Readability is on by default. Only respect an explicit opt-out.
          if (localStorage.getItem('dailies/readable') !== 'false') {
            document.documentElement.setAttribute('data-readable', 'true');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-readable', 'true');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
